[package]
name = "syspilot-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
instability = "=0.3.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
pretty_assertions = "1"
